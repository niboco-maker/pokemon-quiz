<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ポケモン地方図鑑クイズ</title>
<style>
:root{font-family:system-ui,-apple-system,"Yu Gothic",Meiryo,sans-serif;color:#202633;background:#f4f7fb}
body{margin:0;padding:20px}.app{max-width:900px;margin:auto;background:white;border-radius:18px;padding:24px;box-shadow:0 8px 30px #15294b18}
h1{margin-top:0;font-size:clamp(1.5rem,4vw,2.1rem)}.sub{color:#596579}
.controls,.stats,.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0}
select,input,button{font:inherit;border:1px solid #ccd4e0;border-radius:10px;padding:10px 12px}
input{flex:1;min-width:180px}button{cursor:pointer;background:#eef3fb}button.primary{background:#275dad;color:white;border-color:#275dad}
button:disabled{opacity:.45;cursor:not-allowed}.stat{background:#f0f5fc;padding:10px 14px;border-radius:10px;min-width:100px}
.stat strong{display:block;font-size:1.3rem}.layout{display:grid;grid-template-columns:minmax(220px,320px) 1fr;gap:24px;align-items:center}
figure{margin:0;background:#f3f6fb;border-radius:16px;display:grid;place-items:center;min-height:270px}
figure img{width:100%;max-width:300px;aspect-ratio:1;object-fit:contain;image-rendering:auto}
#feedback{min-height:1.6em;font-weight:700;margin:12px 0}#feedback.good{color:#167245}#feedback.bad{color:#b43a36}
.progress{margin:8px 0}.progress-label{display:flex;justify-content:space-between;font-size:.92rem}.bar{height:9px;background:#e8edf4;border-radius:99px;overflow:hidden}.bar span{display:block;height:100%;background:#3a82d5;width:0}
details{margin-top:18px;border-top:1px solid #e4e9f1;padding-top:14px}ul{padding-left:22px}.small{font-size:.9rem;color:#687386}
@media(max-width:650px){.layout{grid-template-columns:1fr}figure{min-height:230px}.app{padding:16px}body{padding:10px}}
</style>
</head>
<body>
<main class="app">
<h1>ポケモン地方図鑑クイズ</h1>
<p class="sub">写真を見てポケモンの名前を入力しよう！地方図鑑のデータと公式イラストをオンラインから取得します。</p>
<div class="controls">
<label for="region">地方：</label>
<select id="region">
<option value="kanto">カントー</option><option value="original-johto">ジョウト</option>
<option value="hoenn">ホウエン</option><option value="original-sinnoh">シンオウ</option>
<option value="original-unova">イッシュ</option><option value="kalos-central">カロス（中央）</option>
<option value="original-alola">アローラ</option><option value="galar">ガラル</option><option value="paldea">パルデア</option>
</select>
<button id="load">地方を読み込む</button>
</div>
<div class="stats">
<div class="stat">正解数<strong id="correct">0</strong></div>
<div class="stat">回答数<strong id="answered">0</strong></div>
<div class="stat">正答率<strong id="accuracy">—</strong></div>
</div>
<div class="layout">
<figure><img id="pokemon" alt="クイズのポケモン画像" src="" hidden><div id="imageMessage">地方を読み込んでください</div></figure>
<section>
<p id="questionCount">問題 —</p>
<label for="answer">このポケモンの名前は？</label>
<div class="controls"><input id="answer" type="text" placeholder="ポケモンの名前を入力" autocomplete="off"><button class="primary" id="submit">回答する</button></div>
<div id="feedback" role="status" aria-live="polite"></div>
<div class="actions">
<button id="hint">ヒント</button><button id="skip">スキップ</button><button id="show">答えを見る</button><button id="next" class="primary" disabled>次の問題</button>
</div>
<p id="hintText" class="small"></p>
</section>
</div>
<details open><summary><strong>地方ごとの図鑑完成率</strong></summary><div id="progressList" class="small">読み込み後に表示されます。</div></details>
<details><summary><strong>間違えたポケモンの復習</strong></summary><div id="reviewList">まだ間違えたポケモンはいません。</div><button id="clearReview">この地方の復習リストを消去</button></details>
<p id="status" class="small">初回はインターネット接続が必要です。正解履歴はこのブラウザーに保存されます。</p>
</main>
<script>
const dexInfo = {
  kanto:{label:"カントー",total:151}, "original-johto":{label:"ジョウト",total:251},
  hoenn:{label:"ホウエン",total:202}, "original-sinnoh":{label:"シンオウ",total:151},
  "original-unova":{label:"イッシュ",total:156}, "kalos-central":{label:"カロス（中央）",total:150},
  "original-alola":{label:"アローラ",total:302}, galar:{label:"ガラル",total:400}, paldea:{label:"パルデア",total:400}
};
const $=id=>document.getElementById(id);
let questions=[],current=null,locked=false,correct=0,answered=0;
const progress=readStore("pokeQuizProgress",{}), reviews=readStore("pokeQuizReviews",{});
function readStore(k,f){try{return JSON.parse(localStorage.getItem(k))||f}catch{return f}}
function save(){try{localStorage.setItem("pokeQuizProgress",JSON.stringify(progress));localStorage.setItem("pokeQuizReviews",JSON.stringify(reviews))}catch{}}
function norm(s){return (s||"").trim().replace(/\s/g,"").replace(/　/g,"").toLowerCase()}
function updateStats(){$("correct").textContent=correct;$("answered").textContent=answered;$("accuracy").textContent=answered?Math.round(correct/answered*100)+"%":"—"}
function setStatus(s){$("status").textContent=s}
async function loadRegion(){
 const id=$("region").value;locked=false;current=null;questions=[];
 $("pokemon").hidden=true;$("imageMessage").hidden=false;$("imageMessage").textContent="図鑑データを読み込み中…";
 $("feedback").textContent="";$("hintText").textContent="";$("next").disabled=true;$("questionCount").textContent="問題 —";
 $("load").disabled=true;setStatus("図鑑データを取得しています。少しお待ちください…");
 try{
  const r=await fetch(`https://pokeapi.co/api/v2/pokedex/${id}/`);
  if(!r.ok)throw Error("図鑑データを取得できませんでした");
  const d=await r.json();
  const entries=d.pokemon_entries||[];
  const unique=new Map();
  entries.forEach(e=>{const s=e.pokemon_species;if(s&&!unique.has(s.name))unique.set(s.name,{name:s.name,url:s.url,jp:"",id:null})});
  const list=[...unique.values()];
  // Species URL already contains the National Pokédex ID, so the quiz can still
  // proceed if the API is slow or blocks some name requests.
  list.forEach(p=>{const m=p.url.match(/\\/(\\d+)\\/?$/);if(m)p.id=Number(m[1]);p.jp=p.name});
  setStatus(`${dexInfo[id].label}の名前を取得中… (${list.length}匹)`);
  let done=0;
  // Keep concurrency low and retry transient API errors to avoid rate limiting.
  for(let i=0;i<list.length;i+=4){
   await Promise.all(list.slice(i,i+4).map(async p=>{
    for(let attempt=0;attempt<3;attempt++){
     try{
      const response=await fetch(p.url);
      if(!response.ok)throw Error(`HTTP ${response.status}`);
      const x=await response.json();
      const ja=(x.names||[]).find(n=>n.language.name==="ja-Hrkt")||(x.names||[]).find(n=>n.language.name==="ja");
      if(ja)p.jp=ja.name;
      break;
     }catch(e){
      if(attempt===2) console.warn("名前取得をスキップ:",p.name,e);
      else await new Promise(resolve=>setTimeout(resolve,500*(attempt+1)));
     }
    }
   }));
   done=Math.min(i+4,list.length);setStatus(`名前を取得中… ${done}/${list.length}`);
  }
  questions=list.filter(p=>p.id).sort(()=>Math.random()-.5);
  if(!questions.length)throw Error("問題データがありませんでした");
  renderProgress();renderReviews();nextQuestion();
  setStatus(`${dexInfo[id].label}を読み込みました。画像の表示にはインターネット接続が必要です。`);
 }catch(e){
  $("imageMessage").textContent="読み込みに失敗しました。インターネット接続を確認して再度お試しください。";
  setStatus("読み込みに失敗しました："+e.message+"。Wi-Fi接続を確認し、ChromeまたはEdgeで開き直してください。");
 }finally{$("load").disabled=false}
}
function nextQuestion(){
 if(!questions.length)return;
 current=questions.pop();locked=false;
 $("pokemon").hidden=true;$("imageMessage").hidden=false;$("imageMessage").textContent="画像を読み込み中…";
 $("pokemon").onload=()=>{$("pokemon").hidden=false;$("imageMessage").hidden=true};
 $("pokemon").onerror=()=>{$("imageMessage").hidden=false;$("imageMessage").textContent="画像を表示できませんでした"};
 $("pokemon").src=`https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${current.id}.png`;
 $("answer").value="";$("answer").focus();$("feedback").textContent="";$("feedback").className="";$("hintText").textContent="";$("next").disabled=true;
 $("questionCount").textContent=`問題 ${Object.keys(progress[$("region").value]||{}).length+1}・残り ${questions.length}`;
}
function evaluate(fromShow=false){
 if(!current||locked)return;
 const guess=norm($("answer").value);
 if(!fromShow&&!guess){$("feedback").textContent="名前を入力してください。";$("feedback").className="bad";return}
 answered++;
 const ok=!fromShow&&[current.jp,current.name].some(n=>norm(n)===guess);
 const rid=$("region").value;progress[rid]=progress[rid]||{};
 reviews[rid]=reviews[rid]||{};
 if(ok){
  correct++;progress[rid][current.id]=true;delete reviews[rid][current.id];
  $("feedback").textContent=`正解！ ${current.jp}`;$("feedback").className="good";
 }else{
  reviews[rid][current.id]={name:current.jp,id:current.id};
  $("feedback").textContent=`${fromShow?"答え：":"不正解。答えは"} ${current.jp}`;$("feedback").className="bad";
 }
 locked=true;$("next").disabled=false;updateStats();save();renderProgress();renderReviews();
}
function renderProgress(){
 $("progressList").innerHTML=Object.entries(dexInfo).map(([id,info])=>{
  const count=Object.keys(progress[id]||{}).length,pct=Math.min(100,count/info.total*100);
  return `<div class="progress"><div class="progress-label"><span>${info.label}</span><span>${count}/${info.total}（${Math.round(pct)}%）</span></div><div class="bar"><span style="width:${pct}%"></span></div></div>`;
 }).join("");
}
function renderReviews(){
 const list=reviews[$("region").value]||{},vals=Object.values(list);
 $("reviewList").innerHTML=vals.length?`<ul>${vals.map(p=>`<li>${escapeHtml(p.name)} (No. ${p.id})</li>`).join("")}</ul>`:"まだ間違えたポケモンはいません。";
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
$("load").onclick=loadRegion;
$("submit").onclick=()=>evaluate();
$("answer").addEventListener("keydown",e=>{if(e.key==="Enter")evaluate()});
$("next").onclick=nextQuestion;
$("skip").onclick=()=>{if(current&&!locked){reviews[$("region").value]=reviews[$("region").value]||{};reviews[$("region").value][current.id]={name:current.jp,id:current.id};save();renderReviews()}nextQuestion()};
$("show").onclick=()=>evaluate(true);
$("hint").onclick=()=>{if(current)$("hintText").textContent=`ヒント：${current.jp.slice(0,1)} から始まる、${[...current.jp].length}文字の名前です。`};
$("region").onchange=()=>{renderReviews();$("imageMessage").textContent="地方を読み込んでください";$("pokemon").hidden=true;$("imageMessage").hidden=false};
$("clearReview").onclick=()=>{reviews[$("region").value]={};save();renderReviews()};
renderProgress();renderReviews();updateStats();
</script>
</body>
</html>
