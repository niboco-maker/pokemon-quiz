<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ポケモン地方図鑑クイズ（ガラル図鑑番号修正版）</title>
<style>
:root{font-family:system-ui,-apple-system,"Yu Gothic",Meiryo,sans-serif;color:#202633;background:#f4f7fb}
body{margin:0;padding:20px}.app{max-width:900px;margin:auto;background:white;border-radius:18px;padding:24px;box-shadow:0 8px 30px #15294b18}
h1{margin-top:0;font-size:clamp(1.5rem,4vw,2.1rem)}.sub{color:#596579}
.controls,.stats,.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0}
select,input,button{font:inherit;border:1px solid #ccd4e0;border-radius:10px;padding:10px 12px}
input{flex:1;min-width:180px}button{cursor:pointer;background:#eef3fb}button.primary{background:#275dad;color:white;border-color:#275dad}
button:disabled{opacity:.45;cursor:not-allowed}.stat{background:#f0f5fc;padding:10px 14px;border-radius:10px;min-width:100px}
.stat strong{display:block;font-size:1.3rem}.layout{display:grid;grid-template-columns:minmax(220px,320px) 1fr;gap:24px;align-items:center}
figure{margin:0;background:#f3f6fb;border-radius:16px;display:grid;place-items:center;min-height:270px}
figure img{width:100%;max-width:300px;aspect-ratio:1;object-fit:contain;image-rendering:auto}
#feedback{min-height:1.6em;font-weight:700;margin:12px 0}#feedback.good{color:#167245}#feedback.bad{color:#b43a36}
.progress{margin:8px 0}.progress-label{display:flex;justify-content:space-between;font-size:.92rem}.bar{height:9px;background:#e8edf4;border-radius:99px;overflow:hidden}.bar span{display:block;height:100%;background:#3a82d5;width:0}
details{margin-top:18px;border-top:1px solid #e4e9f1;padding-top:14px}ul{padding-left:22px}.small{font-size:.9rem;color:#687386}
@media(max-width:650px){.layout{grid-template-columns:1fr}figure{min-height:230px}.app{padding:16px}body{padding:10px}}
</style>
</head>
<body>
<main class="app">
<h1>ポケモン地方図鑑クイズ</h1>
<p class="sub">写真を見てポケモンの名前を入力しよう！地方図鑑のデータと公式イラストをオンラインから取得します。</p>
<div class="controls">
<label for="region">地方：</label>
<select id="region">
<option value="kanto">カントー</option><option value="original-johto">ジョウト</option>
<option value="hoenn">ホウエン</option><option value="original-sinnoh">シンオウ</option>
<option value="original-unova">イッシュ</option><option value="kalos-central">カロス（中央）</option>
<option value="original-alola">アローラ</option><option value="galar">ガラル</option><option value="paldea">パルデア</option>
</select>

</div>
<div class="stats">
<div class="stat">正解数<strong id="correct">0</strong></div>
<div class="stat">回答数<strong id="answered">0</strong></div>
<div class="stat">正答率<strong id="accuracy">—</strong></div>
</div>
<div class="layout">
<figure><img id="pokemon" alt="クイズのポケモン画像" src="" hidden><div id="imageMessage">地方を読み込んでください</div></figure>
<section>
<p id="questionCount">問題 —</p>
<label for="answer">このポケモンの名前は？</label>
<div class="controls"><input id="answer" type="text" placeholder="ポケモンの名前を入力" autocomplete="off"><button class="primary" id="submit">回答する</button></div>
<div id="feedback" role="status" aria-live="polite"></div>
<div class="actions">
<button id="hint">ヒント</button><button id="skip">スキップ</button><button id="show">答えを見る</button><button id="next" class="primary" disabled>次の問題</button>
</div>
<p id="hintText" class="small"></p>
</section>
</div>
<details open><summary><strong>地方ごとの図鑑完成率</strong></summary><div id="progressList" class="small">読み込み後に表示されます。</div></details>
<details><summary><strong>間違えたポケモンの復習</strong></summary><div id="reviewList">まだ間違えたポケモンはいません。</div><button id="clearReview">この地方の復習リストを消去</button></details>
<p id="status" class="small">初回はインターネット接続が必要です。正解履歴はこのブラウザーに保存されます。</p>
</main>
<script>
const dexInfo = {
  kanto:{label:"カントー",total:151,endpoint:"kanto"},
  "original-johto":{label:"ジョウト",total:251,endpoint:"original-johto"},
  hoenn:{label:"ホウエン",total:202,endpoint:"hoenn"},
  "original-sinnoh":{label:"シンオウ",total:151,endpoint:"original-sinnoh"},
  "original-unova":{label:"イッシュ",total:156,endpoint:"original-unova"},
  "kalos-central":{label:"カロス（中央）",total:150,endpoint:"kalos-central"},
  "original-alola":{label:"アローラ",total:302,endpoint:"original-alola"},
  galar:{label:"ガラル",total:400,endpoint:"galar"},
  paldea:{label:"パルデア",total:400,endpoint:"paldea"}
};
const $=id=>document.getElementById(id);
const regionOrder=Object.keys(dexInfo);
const regionTotals={};
const regionSpeciesIds={};
// 地方で初登場したリージョンフォームも出題対象にする。
const regionalFormGroups={
  "original-alola": {suffix:"-alola", label:"アローラのすがた"},
  galar: {suffix:"-galar", label:"ガラルのすがた"},
  paldea: {suffix:"-paldea", label:"パルデアのすがた"}
};
function readStore(k,f){try{return JSON.parse(localStorage.getItem(k))||f}catch{return f}}
let questions=[],current=null,locked=false,correct=0,answered=0,loadToken=0,activeRegionId=null;
const progress=readStore("pokeQuizProgress",{}), reviews=readStore("pokeQuizReviews",{}), nameCache=readStore("pokeQuizJapaneseNames",{});
function save(){try{localStorage.setItem("pokeQuizProgress",JSON.stringify(progress));localStorage.setItem("pokeQuizReviews",JSON.stringify(reviews));localStorage.setItem("pokeQuizJapaneseNames",JSON.stringify(nameCache))}catch{}}
function norm(s){
 return (s||"").normalize("NFKC").trim().toLowerCase()
  .replace(/[\s\u3000・･]/g,"")
  .replace(/[ァ-ヺ]/g,ch=>String.fromCharCode(ch.charCodeAt(0)-0x60));
}
function updateStats(){$("correct").textContent=correct;$("answered").textContent=answered;$("accuracy").textContent=answered?Math.round(correct/answered*100)+"%":"—"}
function setStatus(s){$("status").textContent=s}
function setQuestionControls(enabled){
 $("answer").disabled=!enabled;$("submit").disabled=!enabled;$("hint").disabled=!enabled;
 $("skip").disabled=!enabled;$("show").disabled=!enabled;
}
function getJapaneseName(species){
 const names=species.names||[];
 const ja=names.find(n=>n.language?.name?.toLowerCase()==="ja-hrkt")||names.find(n=>n.language?.name?.toLowerCase()==="ja");
 return ja?.name||null;
}
function shuffle(items){
 const a=[...items];
 for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
 return a;
}
async function loadRegion(){
 const token=++loadToken;
 const id=$("region").value;
 const info=dexInfo[id];
 activeRegionId=id;current=null;questions=[];locked=false;
 $("pokemon").hidden=true;$("pokemon").removeAttribute("src");
 $("imageMessage").hidden=false;$("imageMessage").textContent="図鑑データを読み込み中…";
 $("feedback").textContent="";$("feedback").className="";$("hintText").textContent="";
 $("next").disabled=true;$("questionCount").textContent="問題 —";setQuestionControls(false);
 renderReviews();setStatus(`${info.label}の図鑑データを取得しています…`);
 try{
  const controller=new AbortController();
  const timeout=setTimeout(()=>controller.abort(),15000);
  let response;
  try{response=await fetch(`https://pokeapi.co/api/v2/pokedex/${info.endpoint}/`,{signal:controller.signal});}
  finally{clearTimeout(timeout)}
  if(token!==loadToken||$("region").value!==id)return;
  if(!response.ok)throw Error(`図鑑データの取得に失敗しました（HTTP ${response.status}）`);
  const data=await response.json();
  if(token!==loadToken||$("region").value!==id)return;
  // Fail closed if the API response is not the Pokédex that was requested.
  if(data.name!==info.endpoint)throw Error(`取得した図鑑が一致しません（要求：${info.endpoint}／応答：${data.name||"不明"}）`);
  if(!Array.isArray(data.pokemon_entries))throw Error("図鑑データの形式が正しくありません");
  // 選択地方より前の地方図鑑に載っている種を集め、重複するポケモンを除外する。
  const regionIndex=regionOrder.indexOf(id);
  const earlierRegions=regionOrder.slice(0,regionIndex);
  const earlierDexResponses=await Promise.all(earlierRegions.map(async earlierId=>{
   const earlierInfo=dexInfo[earlierId];
   const r=await fetch(`https://pokeapi.co/api/v2/pokedex/${earlierInfo.endpoint}/`);
   if(!r.ok)throw Error(`${earlierInfo.label}の図鑑データを取得できませんでした（HTTP ${r.status}）`);
   const d=await r.json();
   if(d.name!==earlierInfo.endpoint||!Array.isArray(d.pokemon_entries))throw Error(`${earlierInfo.label}の図鑑データが正しくありません`);
   return d.pokemon_entries;
  }));
  if(token!==loadToken||$("region").value!==id)return;
  const previouslyListed=new Set();
  for(const entries of earlierDexResponses){
   for(const entry of entries){
    const match=entry.pokemon_species?.url?.match(/\/(\d+)\/?$/);
    if(match)previouslyListed.add(Number(match[1]));
   }
  }
  const unique=new Map();
  for(const entry of data.pokemon_entries){
   const species=entry.pokemon_species;
   if(!species||unique.has(species.name))continue;
   const match=species.url.match(/\/(\d+)\/?$/);
   if(!match)continue;
   const nationalId=Number(match[1]);
   // ガラル地方の通常の出題対象は全国図鑑No.810〜898に限定する。
   // それ以前のポケモンのガラルのすがたは、下のリージョンフォーム処理で別問題として追加する。
   if(id==="galar"&&(nationalId<810||nationalId>898))continue;
   if(previouslyListed.has(nationalId))continue;
   unique.set(species.name,{
    name:species.name,
    jp:nameCache[species.name]||null,
    id:nationalId,
    url:species.url,
    regionId:id,
    dexNumber:entry.entry_number
   });
  }
  // 種としては過去地方に登場していても、選択地方で初登場したリージョンフォームは追加する。
  const formGroup=regionalFormGroups[id];
  if(formGroup){
   const pokemonResponse=await fetch("https://pokeapi.co/api/v2/pokemon?limit=2000");
   if(!pokemonResponse.ok)throw Error("すがた違いの一覧を取得できませんでした");
   const pokemonData=await pokemonResponse.json();
   const formEntries=(pokemonData.results||[]).filter(x=>x.name.endsWith(formGroup.suffix));
   const formDetails=await Promise.all(formEntries.map(async x=>{
    const r=await fetch(x.url); if(!r.ok)return null;
    const p=await r.json();
    const speciesUrl=p.species?.url; const match=speciesUrl?.match(/\/(\d+)\/?$/);
    if(!match)return null;
    const speciesId=Number(match[1]);
    // APIのポケモンIDはフォーム固有なので画像に使用し、種IDは過去地方との重複判定に使う。
    return {name:x.name, id:p.id, speciesId, url:speciesUrl, formLabel:formGroup.label, regionId:id, isRegionalForm:true};
   }));
   for(const form of formDetails){
    if(!form)continue;
    const speciesResponse=await fetch(form.url);
    if(!speciesResponse.ok)continue;
    const speciesData=await speciesResponse.json();
    const baseName=getJapaneseName(speciesData);
    if(!baseName)continue;
    form.jp=`${baseName}（${form.formLabel}）`;
    form.baseJapaneseName=baseName;
    // フォームを独立した問題として管理するため、通常種のIDと衝突しないキーを作る。
    form.progressId=`form-${form.name}`;
    unique.set(form.progressId,form);
   }
  }
  const list=[...unique.values()];
  if(!list.length)throw Error("過去の地方のポケモンを除いた結果、出題対象がありませんでした");
  regionTotals[id]=list.length;
  regionSpeciesIds[id]=new Set(list.map(p=>p.id));
  if(token!==loadToken||$("region").value!==id)return;
  questions=shuffle(list);renderProgress();renderReviews();
  setStatus(`${info.label}の新規出題対象 ${list.length}匹を読み込みました（以前の地方に登場したポケモンは除外）。日本語名を確認しています…`);
  nextQuestion();
  // Background name requests only mutate the list belonging to this still-active load.
  preloadJapaneseNames(list,token,id);
 }catch(e){
  if(token!==loadToken||$("region").value!==id)return;
  current=null;questions=[];$("pokemon").hidden=true;$("pokemon").removeAttribute("src");
  $("imageMessage").hidden=false;$("imageMessage").textContent="読み込みに失敗しました。通信状況を確認して、もう一度地方を選んでください。";
  setStatus("読み込みエラー："+(e.name==="AbortError"?"通信がタイムアウトしました":e.message));
 }
}
async function preloadJapaneseNames(list,token,regionId){
 for(let i=0;i<list.length;i+=3){
  if(token!==loadToken||regionId!==activeRegionId)return;
  await Promise.all(list.slice(i,i+3).map(async p=>{
   if(p.jp)return;
   try{
    const r=await fetch(p.url);
    if(!r.ok)return;
    const species=await r.json();
    const ja=getJapaneseName(species);
    if(ja&&token===loadToken&&regionId===activeRegionId&&p.regionId===regionId){p.jp=ja;nameCache[p.name]=ja;save()}
   }catch(e){}
  }));
 }
 if(token===loadToken&&regionId===activeRegionId)setStatus(`${dexInfo[regionId].label}の日本語名を読み込みました。`);
}
function nextQuestion(){
 if(activeRegionId!==$("region").value)return;
 if(!questions.length){
  current=null;$("pokemon").hidden=true;$("imageMessage").hidden=false;
  $("imageMessage").textContent="この地方の問題は終了しました。地方を選び直すと再開できます。";
  $("questionCount").textContent="出題終了";$("next").disabled=true;setQuestionControls(false);return;
 }
 current=questions.pop();
 if(current.regionId!==activeRegionId){current=null;setStatus("地方の不一致を検出したため、出題を停止しました。地方を選び直してください。");return}
 const target=current;
 locked=false;$("pokemon").hidden=true;$("pokemon").removeAttribute("src");
 $("imageMessage").hidden=false;$("imageMessage").textContent="画像を読み込み中…";
 $("pokemon").onload=()=>{if(current===target&&target.regionId===activeRegionId){$("pokemon").hidden=false;$("imageMessage").hidden=true}};
 $("pokemon").onerror=()=>{if(current===target&&target.regionId===activeRegionId){$("imageMessage").hidden=false;$("imageMessage").textContent="画像を表示できませんでした"}};
 $("pokemon").src=`https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${target.id}.png`;
 $("answer").value="";$("feedback").textContent="";$("feedback").className="";$("hintText").textContent="";$("next").disabled=true;
 $("questionCount").textContent=`問題 ${Object.keys(progress[activeRegionId]||{}).length+1}・残り ${questions.length}`;
 setQuestionControls(true);$("answer").focus();
}
async function ensureJapaneseName(p,token){
 if(p.jp)return true;
 if(nameCache[p.name]){p.jp=nameCache[p.name];return true}
 try{
  const r=await fetch(p.url);
  if(!r.ok)return false;
  const species=await r.json();
  const ja=getJapaneseName(species);
  if(ja&&token===loadToken&&p.regionId===activeRegionId){p.jp=ja;nameCache[p.name]=ja;save()}
 }catch(e){}
 return Boolean(p.jp);
}
async function evaluate(fromShow=false){
 if(!current||locked)return;
 const target=current,regionId=target.regionId,token=loadToken;
 if(regionId!==$("region").value||regionId!==activeRegionId)return;
 const guess=norm($("answer").value);
 if(!fromShow&&!guess){$("feedback").textContent="名前を入力してください。";$("feedback").className="bad";return}
 if(!target.jp){$("feedback").textContent="日本語名を確認中…";$("feedback").className=""}
 const hasJapaneseName=await ensureJapaneseName(target,token);
 if(target!==current||token!==loadToken||regionId!==$("region").value||regionId!==activeRegionId)return;
 if(!hasJapaneseName){$("feedback").textContent="日本語名を取得できませんでした。通信を確認して、もう一度回答してください。";$("feedback").className="bad";return}
 answered++;
 const ok=!fromShow&&(norm(target.jp)===guess||(target.isRegionalForm&&target.baseJapaneseName&&norm(target.baseJapaneseName)===guess));
 progress[regionId]=progress[regionId]||{};reviews[regionId]=reviews[regionId]||{};
 if(ok){
  correct++;progress[regionId][target.progressId||target.id]=true;delete reviews[regionId][target.progressId||target.id];
  $("feedback").textContent=`正解！ ${target.jp}`;$("feedback").className="good";
 }else{
  reviews[regionId][target.progressId||target.id]={name:target.jp,id:target.id};
  $("feedback").textContent=`${fromShow?"答え：":"不正解。答えは"} ${target.jp}`;$("feedback").className="bad";
 }
 locked=true;$("next").disabled=false;updateStats();save();renderProgress();renderReviews();
}
function renderProgress(){
 $("progressList").innerHTML=Object.entries(dexInfo).map(([id,info])=>{
  const total=regionTotals[id]||info.total;
  const count=Object.keys(progress[id]||{}).length,pct=total?Math.min(100,count/total*100):0;
  return `<div class="progress"><div class="progress-label"><span>${info.label}</span><span>${count}/${total}（${Math.round(pct)}%）</span></div><div class="bar"><span style="width:${pct}%"></span></div></div>`;
 }).join("");
}
function renderReviews(){
 const list=reviews[$("region").value]||{},vals=Object.values(list);
 $("reviewList").innerHTML=vals.length?`<ul>${vals.map(p=>`<li>${escapeHtml(p.name)} (No. ${p.id})</li>`).join("")}</ul>`:"まだ間違えたポケモンはいません。";
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
$("region").addEventListener("change",()=>{renderReviews();loadRegion()});
$("submit").addEventListener("click",()=>evaluate());
$("answer").addEventListener("keydown",e=>{if(e.key==="Enter")evaluate()});
$("next").addEventListener("click",nextQuestion);
$("skip").addEventListener("click",()=>{
 if(!current||locked||current.regionId!==$("region").value)return;
 const p=current,rid=p.regionId;reviews[rid]=reviews[rid]||{};
 reviews[rid][p.progressId||p.id]={name:p.jp||p.name,id:p.id};save();renderReviews();nextQuestion();
});
$("show").addEventListener("click",()=>evaluate(true));
$("hint").addEventListener("click",async()=>{
 const target=current,token=loadToken;
 if(!target||target.regionId!==$("region").value)return;
 if(!target.jp){$("hintText").textContent="日本語名を取得中…";await ensureJapaneseName(target,token)}
 if(target!==current||token!==loadToken||!target.jp)return;
 $("hintText").textContent=`ヒント：${target.jp.slice(0,1)} から始まる、${[...target.jp].length}文字の名前です。`;
});
$("clearReview").addEventListener("click",()=>{reviews[$("region").value]={};save();renderReviews()});
renderProgress();renderReviews();updateStats();
loadRegion();
</script>
</body>
</html>
